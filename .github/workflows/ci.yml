name: CI/CD Pipeline for Credit Risk Model

on:
  push:
    branches: [ main, task-* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Create data directory
      run: |
        mkdir -p data/raw data/processed
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Test API endpoints
      run: |
        uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
        sleep 10
        curl -f http://127.0.0.1:8000/
        curl -X POST http://127.0.0.1:8000/predict \
          -H "Content-Type: application/json" \
          -d '{"customers":[{"Total_Amount":50000,"Avg_Amount":2500,"Std_Amount":1500,"Max_Amount":10000,"Min_Amount":100,"Transaction_Count":20,"Unique_Products":5,"Unique_Categories":3,"Fraud_Rate":0,"Avg_PricingStrategy":2.5,"Recency_Days":5,"Avg_Transaction_Hour":14.5}]}'

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: credit-risk-model:latest
        load: true
    
    - name: Test Docker container
      run: |
        docker run -d -p 8000:8000 --name credit-risk-test credit-risk-model:latest
        sleep 15
        docker ps
        curl -f http://localhost:8000/
        docker stop credit-risk-test
        docker rm credit-risk-test
