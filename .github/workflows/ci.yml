name: CI/CD Pipeline for Credit Risk Model

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pandas numpy scikit-learn
        pip install fastapi uvicorn pydantic
    
    - name: Run syntax check
      run: |
        python -m py_compile src/*.py
        python -m py_compile src/api/*.py
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
    
    - name: Import check
      run: |
        python -c "from src.data_processing import RFMFeatureEngineer; print('✅ Import successful')"
        python -c "from src.api.main import app; print('✅ API import successful')"
